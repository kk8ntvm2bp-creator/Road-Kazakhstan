version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: roadscan_db
    environment:
      POSTGRES_DB: roadscan
      POSTGRES_USER: roadscan
      POSTGRES_PASSWORD: roadscan123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadscan"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: roadscan_backend
    environment:
      DATABASE_URL: postgresql://roadscan:roadscan123@db:5432/roadscan
      SECRET_KEY: super-secret-key-change-in-production
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: roadscan_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  uploads_data:
